[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-service"
version = "0.1.0"
description = "notification service for CRM project."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<0.36",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.16,<1.17",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "confluent-kafka>=2.15,<2.16",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=1.18,<2.0",
    "pre-commit>=4.3,<5.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.2,<2.0",
    "ruff>=0.13,<0.14",

]